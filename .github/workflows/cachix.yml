name: Cachix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      host:
        description: NixOS host to build and cache
        required: true
        type: choice
        default: navi
        options:
          - navi
          - oryx
          - r730
          - r730xd
          - r820

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Cachix
        uses: cachix/cachix-action@v16
        with:
          name: aljam
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Select host
        id: host
        env:
          INPUT_HOST: ${{ inputs.host }}
        run: echo "name=${INPUT_HOST:-navi}" >> "$GITHUB_OUTPUT"

      - name: Build system closure
        run: |
          nix build \
            ".#nixosConfigurations.${{ steps.host.outputs.name }}.config.system.build.toplevel" \
            --no-link \
            --print-build-logs
