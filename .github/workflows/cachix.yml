name: Cachix

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      host:
        description: NixOS host to build and cache
        required: true
        type: choice
        default: navi
        options:
          - navi
          - oryx
          - r730
          - r730xd
          - r820

env:
  HOST: ${{ github.event.inputs.host || 'navi' }}

jobs:
  cachix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: aljam
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build selected system closure
        run: >-
          nix build
          .#nixosConfigurations.${HOST}.config.system.build.toplevel
          --no-link
          --print-out-paths > result

      - name: Push selected system closure
        run: cachix push aljam < result
