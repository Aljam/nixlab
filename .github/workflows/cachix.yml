name: Cachix

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      host:
        description: NixOS host to build and cache
        required: true
        type: choice
        default: navi
        options:
          - navi
          - oryx
          - r730
          - r730xd
          - r820

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes

jobs:
  cachix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.host)) || fromJSON('["navi", "oryx", "r730", "r730xd", "r820"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: aljam
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build selected system closure
        run: |
          nix build \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" \
            --no-link \
            --print-build-logs
