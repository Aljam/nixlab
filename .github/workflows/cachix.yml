name: Cachix

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  cachix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: nixlab
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build selected system closure
        run: nix build .#nixosConfigurations.navi.config.system.build.toplevel --no-link --print-out-paths > result

      - name: Push selected system closure
        run: cachix push nixlab < result
