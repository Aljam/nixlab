name: Secrets Detection

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-secrets:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_linux_amd64.tar.gz
          tar -xzf gitleaks_linux_amd64.tar.gz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan for secrets (full history)
        run: |
          gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks-results.json \
            --exit-code 1 \
            --verbose || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-results
          path: gitleaks-results.json

      - name: Check for SOPS files
        run: |
          echo "Checking for proper SOPS encryption..."
          if find . -name "*.enc.yaml" -o -name "*.sops.yaml" | grep -q .; then
            echo "✓ SOPS-encrypted files found"
          else
            echo "⚠️ No SOPS-encrypted files detected"
          fi

      - name: Summary
        run: |
          echo "## Secrets Detection Summary"
          echo ""
          if [ -f gitleaks-results.json ] && [ -s gitleaks-results.json ]; then
            echo "❌ Potential secrets detected!"
            echo ""
            echo "Review the uploaded artifact for details."
            echo ""
            echo "Common false positives:"
            echo "- Example passwords in comments"
            echo "- Test tokens in documentation"
            echo "- SOPS-encrypted files (should be ignored)"
          else
            echo "✅ No secrets detected in repository history"
          fi
